version: '3.8'

services:
  # ======================================================================
  # CORE SERVICES
  # ======================================================================
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gilgamesh-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
  
  # ======================================================================
  # GILGAMESH MESH COMPONENTS
  # ======================================================================
  
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: gilgamesh-orchestrator
    ports:
      - "8005:8000"  # API
      - "9090:9090"  # Metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./ai_services:/ai_services
      # - ./orchestrator:/app
    environment:
      - PYTHONUNBUFFERED=1
      - SENTINEL_HOST_IP=host.docker.internal
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - COMFYUI_URL=http://comfyui:8188
      - WHISPER_URL=http://whisper:9000
    depends_on:
      - qdrant
    restart: unless-stopped
  
  memory:
    build: ./memory
    container_name: gilgamesh-memory
    ports:
      - "9001:9001"  # API
      - "9092:9092"  # Metrics
    # volumes:
    #   - ./memory:/app
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEMORY_API_KEY=gilgamesh-memory-key-change-me
    depends_on:
      - qdrant
    restart: unless-stopped

  notifications:
    build: ./notifications
    container_name: gilgamesh-notifications
    ports:
      - "9003:9003"
    environment:
      - PYTHONUNBUFFERED=1
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    restart: unless-stopped

  # ======================================================================
  # AI SERVICES
  # ======================================================================
  
  ollama:
    image: ollama/ollama:latest
    container_name: gilgamesh-ollama
    volumes:
      - ./ai_services/ollama/models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  
  comfyui:
    image: yanwk/comfyui-boot:latest
    container_name: gilgamesh-comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./ai_services/comfyui/output:/root/comfyui/output
      - ./ai_services/comfyui/models:/root/comfyui/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: gilgamesh-whisper
    ports:
      - "9000:9000"
    volumes:
      - ./ai_services/whisper/cache:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  
  # ======================================================================
  # MONITORING STACK
  # ======================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: gilgamesh-monitoring
    ports:
      - "9093:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: gilgamesh-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=gilgamesh_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_storage:
  qdrant_data:
  prometheus_data:
  grafana_data:
